version: '3'
services:
  slurm-jupyter:
        build:
            context: jupyter
            dockerfile: Dockerfile
        image: stevenrbrandt/slurm-jupyter
        container_name: headnode
        hostname: slurmjupyter
        #user: admin
        user: root
        #entrypoint: sleep infinity
        networks:
            slurm-net:
                aliases:
                    - slurmjupyter
        ports:
            - 443:443
        deploy:
            replicas: 1
            placement:
                constraints:
                    - node.labels.node.type == head
        volumes:
            #- shared-vol:/home
            - /srv/nfs4/etk/home:/home
            - /etc/pki-cluster:/install
            - ./users:/users
  slurm-master:
        build:
            context: master
            dockerfile: Dockerfile
        image: stevenrbrandt/slurm-master
        container_name: master
        hostname: slurmmaster
        user: admin
        networks:
            slurm-net:
                aliases:
                    - slurmmaster
        deploy:
            replicas: 1
            placement:
                constraints:
                    - node.labels.node.type == head
        volumes:
                #- shared-vol:/home
                - /srv/nfs4/etk/home:/home
        #ports:
        #        - 6817:6817
        #        - 6818:6818
        #        - 6819:6819
  slurm-node0:
        build:
            context: node
            dockerfile: Dockerfile
        image: stevenrbrandt/slurm-node
        container_name: node0
        hostname: slurmnode0
        user: admin
        networks:
            slurm-net:
                aliases:
                    - slurmnode0
        deploy:
            replicas: 1
            placement:
                constraints:
                    - node.labels.node.type == head
        volumes:
                #- shared-vol:/home
                - /srv/nfs4/etk/home:/home
  slurm-node1:
        build:
            context: node
            dockerfile: Dockerfile
        image: stevenrbrandt/slurm-node
        container_name: node1
        hostname: slurmnode1
        user: admin
        networks:
            slurm-net:
                aliases:
                    - slurmnode1
        deploy:
            replicas: 1
            placement:
                constraints:
                    - node.labels.node.type == node1
        volumes:
                #- shared-vol:/home
                - /etk/home:/home
        #links:
        #        - slurmmaster
        #ports:
        #        - 6817:6817
        #        - 6818:6818
