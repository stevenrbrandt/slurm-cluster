
[slurmjupyter]

# This machine description file is used internally by simfactory as a template
# during the sim setup and sim setup-silent commands
# Edit at your own risk
# Machine description
nickname        = slurmjupyter
name            = slurmjupyter
location        = LSU
description     = CCT
status          = production

# Access to this machine
hostname        = slurmjupyter.cct.lsu.edu
aliaspattern    = ^slurm(node\d|jupyter)$

# Source tree management
sourcebasedir   = /home/@USER@
optionlist      = slurmjupyter.cfg
submitscript    = slurmjupyter.sub
runscript       = slurmjupyter.run
make            = make -j@MAKEJOBS@
basedir         = /home/@USER@/simulations
ppn             = 2
max-num-threads = 2
num-threads     = 2
memory          = 196608
nodes           = 2
submit          = sbatch @SCRIPTFILE@
getstatus       = squeue -j @JOB_ID@

# need to kill the whole set of processes descending from @JOB_ID@, not just the
# (simfactory) top-level process
stop            = scancel @JOB_ID@
submitpattern   = 'Submitted batch job (\d+)'
statuspattern   = '@JOB_ID@ '
queuedpattern   = ' PD '
queue           = checkpt
runningpattern  = ' (CF|CG|R|TO) '
holdingpattern  = '\(JobHeldUser\)'
exechost        = hostname -s
exechostpattern = (.*)
stdout          = cat @SIMULATION_NAME@.out
stderr          = cat @SIMULATION_NAME@.err
stdout-follow   = sleep 10 ; sattach @JOB_ID@.0
# stdout-follow   = while ! scontrol >/dev/null wait_job @JOB_ID@ ; do sleep 5 ; done ; tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err
maxwalltime     = 72:00:00
disabled-thorns = SystemTopology
